<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compás — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand"><b>Compás</b><span>Analytics</span></div>
      <nav class="chips" id="chips" role="tablist" aria-label="Artista"></nav>
      <div class="sync">
        <small>Última actualización: <b id="last-update">—</b></small>
        <button class="btn" id="refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Actualizar datos
        </button>
      </div>
    </header>
    <div class="upd-m">Última actualización: <b id="last-update-m">—</b></div>

    <section class="hero"><div class="hero-in" id="hero"></div></section>

    <main class="grid" id="grid"></main>

    <footer class="foot"><span class="volante"></span>Datos leídos de <code>data.json</code> · actualízalo y pulsa "Actualizar datos"</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
