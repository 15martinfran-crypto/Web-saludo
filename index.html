<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Artistas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Dashboard de Artistas</h1>
        <p class="subtitle">Redes sociales &amp; streaming</p>
      </div>
      <div class="last-update">
        Última actualización: <span id="last-update-value">—</span>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="content">
      <section class="kpi-grid" id="kpi-grid"></section>

      <section class="panel">
        <h2>Evolución</h2>
        <p class="panel-hint">Se construye automáticamente con cada actualización del <code>data.json</code> que recargues.</p>
        <div class="chart-wrap">
          <canvas id="evolution-chart"></canvas>
        </div>
      </section>

      <section class="tables-grid" id="tables-grid"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
